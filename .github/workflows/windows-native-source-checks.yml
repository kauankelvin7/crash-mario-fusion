name: Windows asset-free native checks

on:
  push:
    branches: [feat/m36-operator-pose-gate, feat/m37-paired-native-capture, feat/m38-operator-qa, feat/m4-embedded-sm64-spike, feat/m41-mario-mesh-preview, feat/m41b-output-overlay, feat/m41b2-mario-texture, feat/m41b2b-camera-provenance, feat/goal19-source-integration, feat/goal19-authentic-contact, feat/goal19-unified-diagnostics, feat/goal19-query-sentinel-observe]
  pull_request:
    branches: [feat/m3-coordinate-contract, feat/m3-integration-observer, feat/m34-windows-source-ci, feat/goal19-source-integration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-native-probes:
    name: Windows x64 MinGW64 Python and public native source oracles
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      # Windows core.autocrlf can change shell fixture line endings during checkout.
      - name: Preserve source line endings
        shell: pwsh
        run: git config --global core.autocrlf input

      - name: Checkout project source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout pinned public Mario collision source
        uses: actions/checkout@v4
        with:
          repository: sm64pc/sm64ex
          ref: d7ca2c04364a6dd0dac58b47151e04e26887e6f0
          path: .cache/native-sm64ex
          persist-credentials: false

      - name: Checkout pinned public Crash collision reference
        uses: actions/checkout@v4
        with:
          repository: wurlyfox/c1
          ref: 256fdcef59f15a190290cc19db3fa9a707843b69
          path: .cache/native-c1
          persist-credentials: false

      # The user's documented native Windows source-only toolchain is MSYS2
      # MINGW64. This is not a commercial game build or a graphics test.
      - name: Install MSYS2 MinGW64 Python and GCC
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-python

      - name: Parse all Windows PowerShell scripts without executing game commands
        shell: pwsh
        run: |
          $scripts = @(Get-ChildItem -LiteralPath tools/windows -Filter '*.ps1' -File -Recurse)
          if ($scripts.Count -lt 15) { throw "Unexpectedly missing Windows scripts: $($scripts.Count)" }
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName, [ref]$tokens, [ref]$errors)
            if ($errors) { throw "PowerShell syntax error in $($script.Name): $($errors -join '; ')" }
          }
          Write-Output "Parsed $($scripts.Count) Windows PowerShell scripts; none executed."

      - name: Run complete Python suite and original C geometry probes on Windows
        shell: msys2 {0}
        env:
          CM64_SM64EX_ROOT: ${{ github.workspace }}/.cache/native-sm64ex
          CM64_C1_ROOT: ${{ github.workspace }}/.cache/native-c1
        run: |
          set -euo pipefail
          echo "MSYSTEM=$MSYSTEM"
          python --version
          gcc --version
          python -m unittest discover -s tests -v

      - name: Checkout pinned public RecompOne Crash launcher sources
        uses: actions/checkout@v4
        with:
          repository: Matteo842/CrashBandicoot-Launcher
          ref: 224da7757920a817de2d9242416f657ab95782ea
          path: .cache/native-crash-launcher
          persist-credentials: false

      - name: Install .NET SDK for original RecompOne fixture
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Validate GOAL 19 original Crash decoder and independent Mario input source contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & dotnet run --project tests/CrashOctree.Tests.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Original Crash source octree fixture failed' }
          & dotnet run --project tests/m43_input/InputTests.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Independent Mario input fixture failed' }
          & dotnet run --project tests/mario_gpu/MarioGpuChecks.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Default-off GPU source/mesh contract failed' }
          Write-Output 'VERIFIED_SYNTHETIC: GPU source contract, 27 Crash octree and 17 Mario input assertions; no game.'

      - name: Verify pinned public Crash GPU source seam in MSYS2
        shell: msys2 {0}
        run: |
          set -euo pipefail
          python -m tools.prepare_goal19_renderer --source .cache/native-crash-launcher
          echo 'VERIFIED_SYNTHETIC: source-only renderer seam; no retail game or user assets.'

      - name: Verify strict native C# query receipt decoder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & dotnet run --project tests/native_query/QueryTests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Native query descriptor/owner checks failed' }
          Write-Output 'VERIFIED_SYNTHETIC: native C# receipt decoder; no retail game or colliders.'

      - name: Compare original c1 query bytes with C# decoder in MSYS2
        shell: msys2 {0}
        env:
          CM64_C1_ROOT: ${{ github.workspace }}/.cache/native-c1
          CM64_QUERY_CHECKS_DLL: ${{ github.workspace }}/.cache/native-query-tests/bin/net10.0/QueryTests.dll
          CM64_DOTNET: C:/Program Files/dotnet/dotnet.exe
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_native_query.py -v
          echo 'VERIFIED_SYNTHETIC: original pinned c1 C query bytes validated against native C# decoder.'

      - name: Compile and run public Crash mod event-bus and RAM fixture on Windows
        shell: pwsh
        env:
          CM64_CRASH_PUBLIC_ROOT: ${{ github.workspace }}/.cache/native-crash-launcher
        run: |
          $ErrorActionPreference = 'Stop'
          $version = & dotnet --version
          if ($LASTEXITCODE -ne 0 -or $version -ne '10.0.401') {
            throw "Expected .NET SDK 10.0.401, got $version"
          }
          & dotnet run --project tests/crash_pose/CrashPoseChecks.csproj "-p:CrashRoot=$env:CM64_CRASH_PUBLIC_ROOT" -- "$PWD"
          if ($LASTEXITCODE -ne 0) { throw "Pinned native Crash fixture failed: $LASTEXITCODE" }

      - name: Compile original CMJ1 C sender on native Windows
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p .cache/integration
          gcc -std=c11 -Wall -Wextra -Werror -Iintegration/sm64 \
            integration/sm64/cm64_coin.c tests/integration/native_sender.c \
            -lws2_32 -o .cache/integration/native-coin-sender.exe

      - name: Execute original M2 C sender to Crash mod event-bus fixtures on Windows
        shell: pwsh
        env:
          CM64_CRASH_PUBLIC_ROOT: ${{ github.workspace }}/.cache/native-crash-launcher
        run: |
          $ErrorActionPreference = 'Stop'
          $nativeSender = Join-Path $PWD '.cache/integration/native-coin-sender.exe'
          if (-not (Test-Path -LiteralPath $nativeSender)) { throw 'Native Windows CMJ1 sender executable missing' }
          & dotnet run --project tests/integration/IntegrationChecks.csproj "-p:CrashRoot=$env:CM64_CRASH_PUBLIC_ROOT" -- "$PWD" $nativeSender
          if ($LASTEXITCODE -ne 0) { throw "M2 native sender/Crash adapter checks failed: $LASTEXITCODE" }

      - name: Mark exactly what Windows CI verified
        shell: pwsh
        run: |
          Write-Output 'VERIFIED_SYNTHETIC only: native Windows source-only tests and compiled public fixture probes.'
          Write-Output 'This runner did NOT launch retail Crash/Mario, validate GPU/OpenGL, build the private launcher,'
          Write-Output 'validate real poses, certify engine post-physics callbacks, or test shared collisions.'
          Write-Output 'No ROMs, discs, private runtime caches or telemetry are used or published.'
