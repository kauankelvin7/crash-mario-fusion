name: Asset-free integration checks

on:
  push:
    branches: [m0-recon, feat/m36-operator-pose-gate, feat/m37-paired-native-capture]
  pull_request:
    branches: [m0-recon, feat/m3-coordinate-contract, feat/m34-windows-source-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only:
    name: Combined CMW1, calibration and geometry checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout pinned public sm64ex source for isolated collision oracle
        uses: actions/checkout@v4
        with:
          repository: sm64pc/sm64ex
          ref: d7ca2c04364a6dd0dac58b47151e04e26887e6f0
          path: .cache/native-sm64ex
          persist-credentials: false
      # Public reference source only; no game data or full c1 runtime build.
      - name: Checkout pinned c1 collision reference
        uses: actions/checkout@v4
        with:
          repository: wurlyfox/c1
          ref: 256fdcef59f15a190290cc19db3fa9a707843b69
          path: .cache/native-c1
          persist-credentials: false
      - name: Test source-only code, recorded trace, and original collision queries
        env:
          CM64_SM64EX_ROOT: ${{ github.workspace }}/.cache/native-sm64ex
          CM64_C1_ROOT: ${{ github.workspace }}/.cache/native-c1
        run: python -m unittest discover -s tests -v
      - name: Explicitly report verification level
        run: |
          echo "VERIFIED_SYNTHETIC only: this runner did not execute either retail game."
          echo "Windows real-runtime evidence is preserved in docs/EVIDENCE.md."
          echo "No ROMs, PS1 BIN/CUE, CHD, extracted assets, or commercial game data are used."
